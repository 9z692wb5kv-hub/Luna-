const SYM={KZT:'₸',USD:'$',EUR:'€',RUB:'₽'},fm=(n,c)=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n))+' '+(SYM[c||'KZT']||c),fmt=n=>fm(n,'KZT');

let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||demo();
S.rates=S.rates||{KZT:1,USD:500,EUR:540,RUB:6};S.dep=S.dep||[];S.cr=S.cr||[];

function prevKey(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return ym(d)}
function toast(s){const t=$('#toast');t.textContent=s;t.className='on';setTimeout(()=>t.className='',1800)}

const last=[...[]];let V='home',F='all';
function budgetBar(){const e=mon().exp,b=S.budget;if(!b)return'';const p=e/b*100;return`<div class=card style="margin-top:12px" onclick=openBudget()><div class=bh><b>Бюджет месяца</b><span>${Math.round(p)}%</span></div><div class=bar><i style="width:${Math.min(100,p)}%;background:${p>=100?'var(--rd)':p>=80?'#F5A524':'var(--pr)'}"></i></div><div class=mu style="margin-top:6px">Осталось ${fmt(Math.max(0,b-e))} из ${fmt(b)}</div></div>`}
function vHome(){const{inc,exp}=mon(),l=[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5);
return`<div class=top><div class=logo><svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E4FD8"/><stop offset="1" stop-color="#5BB5F0"/></linearGradient></defs><path d="M44 8a26 26 0 1 0 12 36A21 21 0 0 1 44 8z" fill="url(#lg)"/></svg>LUNA</div><div><button class=ib onclick=theme() aria-label="Тема">◐</button></div></div>
<div class=hero><div>Общий капитал</div><h1>${fmt(total())}</h1><div class=hs><div>Доходы<b>${fmt(inc)}</b></div><div>Расходы<b>${fmt(exp)}</b></div><div>Баланс месяца<b>${fmt(inc-exp)}</b></div></div></div>
${budgetBar()}<h3>Счета</h3><div class=hz>${S.acc.map(card).join('')}</div><h3>Последние операции</h3><div class=card>${l.map(row).join('')||'<div class=mu>Нажмите + чтобы добавить</div>'}</div>${S.demo?'<div class=mu style="text-align:center">Показаны демо-данные · <a href=# onclick="clr();return false" style="color:var(--pr)">очистить и начать с нуля</a></div>':''}`}

function vAcc(){return`<div class=top><h2>Счета</h2><button class=bt onclick="openAdd();setT('t')">⇄ Перевод</button></div>${S.acc.map(a=>`<div class=card><div class=bh><b>${a.b}</b><b>${fm(bal(a),a.cur)}</b></div>${card(a)}</div>`).join('')}<button class="bt p" onclick=openAcc()>+ Новый счёт</button>`}
function vAn(){const{inc,exp,bc}=mon(),p=mon(prevKey()),cs=Object.entries(bc).sort((a,b)=>b[1]-a[1]),mx=cs[0]?.[1]||1,n=new Date(),dm=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),fc=exp/n.getDate()*dm;
const br=(l,v,w,c)=>`<div style="margin-top:10px"><div class=bh><span>${l}</span><b>${fmt(v)}</b></div><div class=bar><i style="width:${w}%;background:${c}"></i></div></div>`,mm=Math.max(inc,exp,p.inc,p.exp,1);
return`<div class=top><h2>Аналитика</h2></div><div class=card><b>Умный прогноз</b><div class=mu style="margin-top:6px">При текущем темпе расходы за месяц составят около <b style="color:var(--tx)">${fmt(fc)}</b>${S.budget?(fc>S.budget?`, это выше бюджета на ${fmt(fc-S.budget)}`:`, это в пределах бюджета`):''}.${p.exp?` В прошлом месяце расходы были ${fmt(p.exp)}.`:''}</div></div>
<div class=card><b>Этот месяц и прошлый</b>${br('Доходы сейчас',inc,inc/mm*100,'var(--gn)')}${br('Доходы раньше',p.inc,p.inc/mm*100,'var(--sf)')}${br('Расходы сейчас',exp,exp/mm*100,'var(--rd)')}${br('Расходы раньше',p.exp,p.exp/mm*100,'var(--sf)')}</div>
<div class=card><b>Расходы по категориям</b>${cs.map(([i,v])=>br(C[i][1]+' '+C[i][0],v,v/mx*100,C[i][2])).join('')||'<div class=mu style="margin-top:8px">Нет расходов за месяц</div>'}</div>`}
function vMore(){return`<div class=top><h2>Ещё</h2></div><div class=tl><button onclick=openCalc()>🧮<br>Калькулятор</button><button onclick=openConv()>💱<br>Конвертер</button><button onclick=openBudget()>🎯<br>Бюджет</button><button onclick=theme()>◐<br>Тема</button></div><h3>Разделы</h3><div class=tl><button onclick="go('rep')">📊<br>Отчёты</button><button onclick="go('fin')">🏦<br>Депозиты и кредиты</button><button onclick="go('notes')">📝<br>Заметки</button><button onclick=openRates()>💱<br>Курсы валют</button><button onclick="go('cal')">📅<br>Календарь</button><button onclick="go('tasks')">✅<br>Задачи</button><button onclick="go('hab')">🔥<br>Привычки</button>${Object.entries(T).map(([k,v])=>`<button onclick="LK='${k}';go('list')">${v[1]}<br>${v[0]}</button>`).join('')}${['Библиотека PDF'].map(s=>`<button class=off onclick="toast('Следующий этап')">${s}</button>`).join('')}</div>`}
const TABS=[['home','◉','Главная'],['tx','☰','Операции'],['acc','▭','Счета'],['an','▥','Аналитика'],['more','⋯','Ещё']];
function render0(){$('#app').innerHTML=({home:vHome,tx:vTx,acc:vAcc,an:vAn,more:vMore,list:vList,rep:vRep,fin:vFin,notes:vNotes,cal:vCal,hab:vHab,tasks:vTasks})[V]();$('#nv').innerHTML=TABS.map(([k,i,n])=>`<button class="${V==k||(k=='more'&&['list','rep','fin','notes','cal','hab','tasks'].includes(V))?'on':''}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('')}

let D={type:'e',c:0};

function addForm(){const cs=C.map((c,i)=>[c,i]).filter(([c])=>c[3]==D.type);sheet('Новая операция',`<div class=chips style="margin-top:8px"><button class="${D.type=='e'?'on':''}" onclick="setT('e')">Расход</button><button class="${D.type=='i'?'on':''}" onclick="setT('i')">Доход</button><button class="${D.type=='t'?'on':''}" onclick="setT('t')">Перевод</button></div><input class=big id=am type=number inputmode=decimal placeholder="0" value="${D.amt||''}"><div class=cg>${cs.map(([c,i])=>`<button class="${D.c==i?'on':''}" onclick="keep();D.c=${i};addForm()"><span>${c[1]}</span>${c[0]}</button>`).join('')}</div><label>${D.type=='t'?'Со счёта':'Счёт'}<select id=ac onchange="keep()">${S.acc.map(a=>`<option value=${a.id}${a.id==D.a?' selected':''}>${a.b} · ${a.n}</option>`).join('')}</select></label>${D.type=='t'?`<label>На счёт<select id=to onchange="keep()">${S.acc.map(a=>`<option value=${a.id}${a.id==D.to?' selected':''}>${a.b} · ${a.n}</option>`).join('')}</select></label>`:''}<label>Комментарий<input id=nt value="${D.n||''}"></label><button class="bt p" onclick=saveTx()>Сохранить</button>`)}

function saveItem(id){const k=LK,t=$('#it').value.trim();if(!t)return toast('Введите название');const val=(idv)=>$(idv)?$(idv).value:'';const o={t,x:val('#ix'),amt:+val('#ia')||0},optional={due:val('#due'),photo:val('#photo'),url:val('#url'),person:val('#person'),direction:val('#direction'),paid:+val('#paid')||0,cycle:val('#cycle'),next:val('#next'),remind:+val('#remind')||0,priority:val('#priority')};Object.entries(optional).forEach(([a,b])=>{if(b!==''||['paid','remind'].includes(a))o[a]=b});['photo','url'].forEach(a=>{if(o[a]&&!/^https?:\/\//i.test(o[a]))o[a]=''});const x=IT().find(y=>y.id==id);if(x)Object.assign(x,o);else S.items.push({id:uid(),k,d:new Date().toISOString(),done:0,sv:0,...o});save();closeSh();render()}

function openCr(id){const x=S.cr.find(y=>y.id===id)||{};frmG(id?'Кредит · настройки':'Новый кредит',[['n','Название'],['total','Общая сумма, ₸','number'],['paid','Уже выплачено, ₸','number'],['pay','Платёж в месяц, ₸','number'],['rate','Ставка годовых, %','number'],['next','Дата следующего платежа','date']],x,v=>{v.paid=Math.min(v.total,Math.max(0,v.paid));upk('cr',id,v)},id?()=>rmk('cr',id):0);if(id)setTimeout(()=>{const b=document.createElement('button');b.className='bt';b.style.width='100%';b.style.marginTop='8px';b.textContent='Посмотреть график платежей';b.onclick=()=>creditSchedule(id);$('#sh .pn').appendChild(b)},0)}
function creditSchedule(id){const x=S.cr.find(y=>y.id===id);if(!x)return;let bal=Math.max(0,(+x.total||0)-(+x.paid||0)),rate=(+x.rate||0)/1200,pay=+x.pay||0,date=x.next||today(),rows=[],i=0;while(bal>.01&&i<600&&pay>0){const interest=bal*rate,principal=Math.min(bal,Math.max(0,pay-interest));if(principal<=0){rows.push({date,pay:interest,interest,principal:0,bal});break}const actual=principal+interest;bal=Math.max(0,bal-principal);rows.push({date,pay:actual,interest,principal,bal});const d=new Date(date+'T12:00:00');d.setMonth(d.getMonth()+1);date=d.toISOString().slice(0,10);i++}sheet('График платежей · '+esc(x.n),`<div class=card><div class=mu>Остаток по введённым данным</div><h2>${fmt(Math.max(0,x.total-x.paid))}</h2><div class=mu>Расчёт ориентировочный, не банковский график. Фактические проценты и даты могут отличаться.</div></div><div style="overflow-x:auto"><table class=rt><thead><tr><th>№</th><th>Дата</th><th>Платёж</th><th>Проценты</th><th>Основной долг</th><th>Остаток</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.date}</td><td>${fmt(r.pay)}</td><td>${fmt(r.interest)}</td><td>${fmt(r.principal)}</td><td>${fmt(r.bal)}</td></tr>`).join('')}</tbody></table></div>${!rows.length?'<div class=mu>Добавьте сумму платежа и дату, чтобы построить график.</div>':''}`)}
async function backupExport(){try{const notes=await nreq('readonly',s=>s.getAll());const blob=new Blob([JSON.stringify({app:'LUNA',version:3,created:new Date().toISOString(),data:S,notes},null,2)],{type:'application/json'});await lunaSaveFile(new File([blob],'LUNA-backup-'+today()+'.json',{type:'application/json'}));toast('Копия данных и заметок подготовлена')}catch(e){toast('Не удалось включить заметки в копию')}}
function backupImport(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(o.app!=='LUNA'||!o.data?.acc||!o.data?.tx)throw 0;if(!confirm('Заменить текущие данные копией? Сначала сохрани текущую резервную копию.'))return;S=o.data;save();if(Array.isArray(o.notes)){const db=await NDB();await new Promise((ok,no)=>{const tx=db.transaction('notes','readwrite'),st=tx.objectStore('notes');st.clear();o.notes.forEach(n=>st.put(n));tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}render();toast('Данные и заметки восстановлены')}catch(e){toast('Файл копии не распознан или заметки не восстановились')}};r.readAsText(f)}

function payCr(id){const x=S.cr.find(y=>y.id===id);if(!x)return;x.history=x.history||[];const amount=Math.min(Math.max(0,x.total-x.paid),x.pay);if(amount<=0)return toast('Кредит уже выплачен');x.paid+=amount;x.history.push({d:today(),amt:amount});const d=new Date((x.next||today())+'T12:00:00');d.setMonth(d.getMonth()+1);x.next=d.toISOString().slice(0,10);save();render();toast('Платёж учтён в истории')}

function imageToDataURL(file,max=1100){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}

</style><script>/* LUNA 3.2 — Notes like iPhone Notes: papers, camera, sketch, folders, grid/list */

window.nEmo=()=>sheet('Эмодзи',`<div class=pk>${L([...'😀😍🥰😎🤔😴🎉🔥✨💡✅❗💰🎯📌❤️🌙☀️🌸🍕☕🎵📚✈️🏠'],e=>`<i onclick="nx('insertText','${e}');closeSh()" style="font-size:22px;width:44px;height:44px">${e}</i>`)}</div>`);
let DR={};
window.nDraw=()=>{DR={c:'#1E4FD8',w:3,h:[]};sheet('Рисунок',`<canvas id=dcv width=340 height=380 style="width:100%;touch-action:none;border-radius:16px;background:#fff;border:1px solid var(--ln)"></canvas><div class=pk style="margin-top:10px">${L(['#1E4FD8','#111111','#E05468','#15A394','#F5A524','#7B61C9'],c=>`<i class="c ${c==DR.c?'on':''}" style="background:${c}" onclick="DR.c='${c}';dpk(this)"></i>`)}<i onclick="DR.w=DR.w==3?8:3;toast('Толщина: '+DR.w)">✎</i><i onclick="dUn()">↶</i></div><button class="bt p" style="width:100%" onclick="dIns()">Вставить в заметку</button>`);
const cv=$('#dcv'),x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,340,380);x.lineCap=x.lineJoin='round';let dr=0,cur;const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*340/r.width,(e.clientY-r.top)*380/r.height]};
cv.onpointerdown=e=>{dr=1;cv.setPointerCapture(e.pointerId);cur={c:DR.c,w:DR.w,p:[pt(e)]};DR.h.push(cur);dRe()};cv.onpointermove=e=>{if(!dr)return;cur.p.push(pt(e));dRe()};cv.onpointerup=()=>dr=0;
window.dRe=()=>{x.fillStyle='#fff';x.fillRect(0,0,340,380);DR.h.forEach(s=>{x.strokeStyle=s.c;x.lineWidth=s.w;x.beginPath();s.p.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));if(s.p.length==1)x.lineTo(s.p[0][0]+.1,s.p[0][1]);x.stroke()})}};
window.dpk=el=>{el.parentNode.querySelectorAll('i.c').forEach(i=>i.classList.remove('on'));el.classList.add('on')};window.dUn=()=>{DR.h.pop();dRe()};
window.dIns=()=>{const u=$('#dcv').toDataURL('image/png');closeSh();nx('insertHTML',`<p><img src="${u}" style="max-width:100%;border-radius:12px;background:#fff"></p>`)};
function deco(){const o=$('#ned');if(!o||o.dataset.d||!NE)return;o.dataset.d=1;const nb=$('#nb');nb.className='pp'+(NE.bg?' pp-'+NE.bg:'');
const B=(l,f)=>`<button class=ib onmousedown="event.preventDefault()" onclick="${f}">${l}</button>`,bar=document.createElement('div');bar.className='nbar';
bar.innerHTML=B('🎨','nPaper()')+B('📷',"nCam('cam')")+B('🖼',"nCam('multi')")+B('✏️','nDraw()')+B('😊','nEmo()')+B('📌',"NE.pin=!NE.pin;toast(NE.pin?'Закреплено':'Откреплено');nsave()")+B('⭐',"NE.fav=!NE.fav;toast(NE.fav?'В избранном':'Убрано');nsave()")+'<span id=wc class=mu style="margin-left:auto;white-space:nowrap;padding:0 8px"></span>';
nb.parentNode.insertBefore(bar,nb);const wc=()=>{const t=nb.innerText.trim(),w=t?t.split(/\s+/).length:0;$('#wc').textContent=w+' сл. · '+t.length+' зн.'};wc();nb.addEventListener('input',wc)}
new MutationObserver(deco).observe(document.body,{childList:true});
render();
})();
</script><style>.dstrip{display:flex;gap:8px;overflow-x:auto;margin-top:8px}.ds{flex:none;text-align:center;font-size:22px;min-width:34px}.ds small{display:block;font-size:10px;color:var(--mu)}
.card .st:first-child{border-top:0}input[type=range]{padding:0;height:28px}
</style><script>/* LUNA 3.3 — diary, debts, subscriptions, shopping, full backup */
(function(){
const L=(a,f)=>a.map(f).join(''),MD=['😊','😌','🥰','🤩','😐','😔','😢','😡'];
const ds=d=>new Date(d+'T12:00:00'),dd=d=>Math.round((ds(d)-ds(today()))/864e5);
const bdt=d=>{const n=dd(d);return n<0?['просрочено '+(-n)+' дн.','#E05468']:n==0?['сегодня','#F5A524']:n==1?['завтра','#F5A524']:['через '+n+' дн.','#5BB5F0']};
const bg=(t,c)=>`<span class=bdg style="background:${c}">${t}</span>`,rem=x=>Math.max(0,(x.amt||0)-(x.paid||0));
let DE={},DF='all';
/* ---------- DIARY ---------- */
const dgal=()=>L(DE.media,(m,i)=>`<div class=gi>${m.t=='i'?`<img data-m="${m.id}">`:`<video data-m="${m.id}" controls playsinline muted></video>`}<button onclick="dRm(${i})">✕</button></div>`)||'<div class=mu>Добавьте фото или видео дня</div>';
window.diaryEdit=function(id){const x=IT().find(y=>y.id==id)||{};DE={mood:x.mood||'😌',en:x.en||3,media:[...(x.media||[])],rm:[]};
sheet(id?'Запись дня':'Новый день',`<input id=dyt class=big placeholder="Как назовёте этот день?" value="${esc(x.title||'')}"><label>Дата<input id=dyd type=date value="${esc(x.date||today())}"></label>
<label>Настроение</label><div class=pk>${L(MD,m=>`<i class="${m==DE.mood?'on':''}" style="font-size:22px;width:42px;height:42px" onclick="dMood('${m}',this)">${m}</i>`)}</div>
<label>Энергия: <b id=dev>${DE.en}</b> из 5<input type=range min=1 max=5 value="${DE.en}" oninput="DE.en=+this.value;$('#dev').textContent=this.value"></label>
<label>Как прошёл день?<textarea id=dyx class=ta oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(x.text||'')}</textarea></label>
<label>Что получилось<input id=dyw value="${esc(x.win||'')}" placeholder="Маленькая победа дня"></label><label>За что благодарна<input id=dyg value="${esc(x.gratitude||'')}"></label>
<h3>Фото и видео</h3><div id=dmg class=gg>${dgal()}</div><div class=row2><button class=bt onclick="dAdd('image/*','i')">📷 Фото</button><button class=bt onclick="dAdd('video/*','v')">🎞 Видео</button></div>
<button class="bt p" style="width:100%;margin-top:14px" onclick="dSave('${id||''}')">Сохранить</button>${id?`<button class=bt style="width:100%;margin-top:8px;color:var(--rd)" onclick="dDel('${id}')">Удалить</button>`:''}`);LM.hy()};
window.dMood=(m,el)=>{DE.mood=m;el.parentNode.querySelectorAll('i').forEach(i=>i.classList.remove('on'));el.classList.add('on')};
window.dAdd=(acc,t)=>{const i=document.createElement('input');i.type='file';i.accept=acc;i.multiple=t=='i';i.onchange=async()=>{for(const f of i.files){try{if(t=='v'&&f.size>150*1048576){toast('Видео больше 150 МБ');continue}const b=t=='i'?await LM.shr(f):f,id='m'+uid()+Date.now().toString(36);await LM.mput(id,b);DE.media.push({id,t});$('#dmg').innerHTML=dgal();LM.hy()}catch(e){toast('Не удалось сохранить файл')}}};i.click()};
window.dRm=i=>{DE.rm.push(DE.media[i].id);DE.media.splice(i,1);$('#dmg').innerHTML=dgal();LM.hy()};
window.dSave=id=>{const date=$('#dyd').value;if(!date)return toast('Выберите дату');const o={k:'diary',title:$('#dyt').value.trim()||'Запись дня',date,mood:DE.mood,en:DE.en,text:$('#dyx').value,win:$('#dyw').value,gratitude:$('#dyg').value,media:DE.media},x=IT().find(y=>y.id==id);if(x)Object.assign(x,o);else S.items.push({id:uid(),d:new Date().toISOString(),done:0,...o});DE.rm.forEach(LM.mdel);save();closeSh();render()};
window.dDel=id=>{if(!confirm('Удалить запись вместе с фото и видео?'))return;const x=IT().find(y=>y.id==id);(x.media||[]).forEach(m=>LM.mdel(m.id));S.items=IT().filter(y=>y.id!=id);save();closeSh();render()};
function vDiary(){const l=IT().filter(x=>x.k=='diary').sort((a,b)=>(b.date||'').localeCompare(a.date||'')),set=new Set(l.map(x=>x.date));let st=0;const c=new Date();if(!set.has(today()))c.setDate(c.getDate()-1);while(set.has(dkey(c))){st++;c.setDate(c.getDate()-1)}
let sp='';for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const e=l.find(x=>x.date==dkey(d));sp+=`<div class=ds><span>${e?e.mood:'·'}</span><small>${d.getDate()}</small></div>`}
return`<div class=top><h2>📓 Личный дневник</h2><button class=bt onclick="go('more')">‹ Ещё</button></div>
<div class="card hero2"><span>Серия дней подряд</span><div class=wv>🔥 ${st}</div><div style="opacity:.85">Всего записей: ${l.length}</div></div>
<div class=card><small class=mu>Настроение за 14 дней</small><div class=dstrip>${sp}</div></div>
<button class="bt p" style="width:100%;margin-bottom:12px" onclick="diaryEdit()">＋ Записать день</button>
${L(l,x=>{const im=(x.media||[]).find(m=>m.t=='i'),vd=(x.media||[]).filter(m=>m.t=='v').length;return`<div class="card gc" onclick="diaryEdit('${x.id}')">${im?`<img data-m="${im.id}" class=mi style="height:150px">`:x.photo?`<img src="${x.photo}" class=mi style="height:150px">`:''}<div class=gb><div class=bh><b>${esc(x.title||'Запись дня')}</b><span style="font-size:26px">${esc(x.mood||'')}</span></div><div class=mu>${ds(x.date).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}${x.en?' · ⚡'+x.en+'/5':''}</div>${x.text?`<div style="margin-top:6px;white-space:pre-wrap">${esc(x.text.slice(0,200))}${x.text.length>200?'…':''}</div>`:''}${x.win?`<div class=tg>${bg('🏆 '+esc(x.win),'#15A394')}</div>`:''}${x.gratitude?`<div class=mu style="margin-top:6px">♡ ${esc(x.gratitude)}</div>`:''}${vd?`<div class=tg>${bg('🎞 '+vd,'#5BB5F0')}</div>`:''}</div></div>`})||'<div class="card mu">Запишите первый день: настроение, победу и благодарность.</div>'}`}
/* ---------- DEBTS ---------- */
window.dfl=k=>{DF=k;render()};
function vDebt(){const all=IT().filter(x=>x.k=='debt'),op=all.filter(x=>rem(x)>0),to=op.filter(x=>x.direction!='owe').reduce((s,x)=>s+rem(x),0),ow=op.filter(x=>x.direction=='owe').reduce((s,x)=>s+rem(x),0);
const l=all.filter(x=>DF=='all'?rem(x)>0:DF=='owed'?x.direction!='owe'&&rem(x)>0:DF=='owe'?x.direction=='owe'&&rem(x)>0:rem(x)==0).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
return`<div class=top><h2>🤝 Долги</h2><button class=bt onclick="go('more')">‹ Ещё</button></div>
<div class=wg style="margin:0 0 12px"><div class=card style="margin:0"><span class=mu>Мне должны</span><div class=wv style="color:var(--gn)">${fmt(to)}</div></div><div class=card style="margin:0"><span class=mu>Я должна</span><div class=wv style="color:var(--rd)">${fmt(ow)}</div></div></div>
<div class=chips>${[['all','Открытые'],['owed','Мне должны'],['owe','Я должна'],['done','Закрытые']].map(([k,n])=>`<button class="${DF==k?'on':''}" onclick="dfl('${k}')">${n}</button>`).join('')}</div>
<button class="bt p" style="width:100%;margin-bottom:12px" onclick="openItem()">＋ Новый долг</button>
${L(l,x=>{const r=rem(x),p=x.amt?Math.min(100,(x.paid||0)/x.amt*100):0,me=x.direction=='owe',c=me?'#E05468':'#15A394',b=x.due&&r>0?bdt(x.due):null;
return`<div class=card><div class=bh style="align-items:center;gap:12px"><span class=bi style="background:${c}">${esc((x.person||x.t||'?').trim()[0]||'?').toUpperCase()}</span><div style="flex:1;min-width:0" onclick="openItem('${x.id}')"><b>${esc(x.person||x.t)}</b><div class=mu>${esc(x.person?x.t:'')} ${me?'· я должна':'· должен мне'}</div></div><div style="text-align:right"><b style="color:${c}">${r?fmt(r):'✓ закрыт'}</b><div class=mu>из ${fmt(x.amt||0)}</div></div></div><div class=bar><i style="width:${p}%;background:${c}"></i></div><div class=tg>${b?bg('📅 '+b[0],b[1]):''}${x.due?bg(x.due,'#64748B'):''}</div>${r?`<div class=row2><button class=bt onclick="debtPay('${x.id}')">＋ Учесть ${me?'выплату':'возврат'}</button><button class=bt onclick="openItem('${x.id}')">Изменить</button></div>`:''}</div>`})||'<div class="card mu">Здесь пока пусто</div>'}`}
/* ---------- SUBSCRIPTIONS ---------- */
const per=x=>({'Ежегодно':1/12,'Еженедельно':52/12}[x.cycle]||1);
const adv=x=>{const d=ds(x.next||today());if(x.cycle=='Ежегодно')d.setFullYear(d.getFullYear()+1);else if(x.cycle=='Еженедельно')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1);return dkey(d)};
window.sPaid=id=>{const x=IT().find(y=>y.id==id);x.next=adv(x);save();render();toast('Следующее списание: '+x.next)};
window.sPause=id=>{const x=IT().find(y=>y.id==id);x.pause=!x.pause;save();render()};
function vSub(){const l=IT().filter(x=>x.k=='sub').sort((a,b)=>(a.pause?1:0)-(b.pause?1:0)||(a.next||'9').localeCompare(b.next||'9')),m=l.filter(x=>!x.pause).reduce((s,x)=>s+(x.amt||0)*per(x),0),nx=l.find(x=>!x.pause&&x.next);
return`<div class=top><h2>🔁 Подписки</h2><button class=bt onclick="go('more')">‹ Ещё</button></div>
<div class="card hero2"><span>Тратите на подписки</span><div class=wv>${fmt(m)} <small style="font-size:14px;opacity:.8">/ мес</small></div><div style="opacity:.85">${fmt(m*12)} в год${nx?` · ближайшее: ${esc(nx.t)} (${bdt(nx.next)[0]})`:''}</div></div>
<button class="bt p" style="width:100%;margin-bottom:12px" onclick="openItem()">＋ Новая подписка</button>
${L(l,x=>{const b=x.next&&!x.pause?bdt(x.next):null;return`<div class=card style="${x.pause?'opacity:.55':''}"><div class=bh style="align-items:center;gap:12px"><span class=bi style="background:linear-gradient(135deg,#1E4FD8,#5BB5F0)">${esc((x.t||'?')[0]).toUpperCase()}</span><div style="flex:1;min-width:0" onclick="openItem('${x.id}')"><b>${esc(x.t)}</b><div class=mu>${esc(x.cycle||'Ежемесячно')}${x.pause?' · на паузе':''}</div></div><b>${fmt(x.amt||0)}</b></div><div class=tg>${b?bg('⏳ '+b[0],b[1]):''}${x.next?bg(x.next,'#64748B'):''}</div><div class=row2>${x.pause?'':`<button class=bt onclick="sPaid('${x.id}')">✓ Оплачено</button>`}<button class=bt onclick="sPause('${x.id}')">${x.pause?'▶ Возобновить':'⏸ Пауза'}</button><button class=bt onclick="openItem('${x.id}')">✎</button></div></div>`})||'<div class="card mu">Добавьте подписки, чтобы видеть, сколько они стоят.</div>'}`}
/* ---------- SHOPPING ---------- */
window.shAdd=()=>{const v=$('#shq').value.trim();if(!v)return;const m=v.match(/^(.*?)(?:\s+(\d+))?$/),name=(m[1]||v).trim()||v;S.items.push({id:uid(),k:'shop',d:new Date().toISOString(),done:0,t:name,amt:+m[2]||0,q:1});save();render();setTimeout(()=>$('#shq')&&$('#shq').focus(),60)};
window.shEd=id=>{const x=IT().find(y=>y.id==id);sheet('Покупка',`<label>Название<input id=she value="${esc(x.t)}"></label><label>Цена, ₸<input id=shp type=number inputmode=decimal value="${x.amt||''}"></label><label>Количество<input id=shn type=number value="${x.q||1}"></label><button class="bt p" onclick="shSv('${id}')">Сохранить</button><button class=bt style="width:100%;margin-top:8px;color:var(--rd)" onclick="closeSh();delItem('${id}')">Удалить</button>`)};
window.shSv=id=>{const x=IT().find(y=>y.id==id);x.t=$('#she').value.trim()||x.t;x.amt=+$('#shp').value||0;x.q=Math.max(1,+$('#shn').value||1);save();closeSh();render()};
window.shClr=()=>{if(!confirm('Убрать купленное из списка?'))return;S.items=IT().filter(x=>!(x.k=='shop'&&x.done));save();render()};
function vShop(){const l=IT().filter(x=>x.k=='shop').sort((a,b)=>(a.done?1:0)-(b.done?1:0)||b.d.localeCompare(a.d)),op=l.filter(x=>!x.done),sum=op.reduce((s,x)=>s+(x.amt||0)*(x.q||1),0);
return`<div class=top><h2>🛒 Покупки</h2><button class=bt onclick="go('more')">‹ Ещё</button></div>
<div class="card hero2"><span>Осталось купить</span><div class=wv>${op.length} <small style="font-size:14px;opacity:.8">поз.</small></div><div class=bar><i style="width:${l.length?(l.length-op.length)/l.length*100:0}%;background:#fff"></i></div><div style="margin-top:6px;opacity:.85">Примерно на ${fmt(sum)}</div></div>
<div class=row2><input id=shq placeholder="Что купить? Например: Молоко 500" onkeydown="if(event.key=='Enter')shAdd()"><button class="bt p" style="flex:none" onclick="shAdd()">＋</button></div>
<div class=card>${L(l,x=>`<div class=st><input type=checkbox ${x.done?'checked':''} onchange="tog('${x.id}')"><span style="flex:1;${x.done?'text-decoration:line-through;opacity:.55':''}" onclick="shEd('${x.id}')">${esc(x.t)}${(x.q||1)>1?' ×'+x.q:''}</span><b class=mu>${x.amt?fmt(x.amt*(x.q||1)):''}</b></div>`)||'<div class=mu>Список пуст. Добавьте первую покупку выше.</div>'}</div>${l.some(x=>x.done)?'<button class=bt style="width:100%" onclick="shClr()">🧹 Убрать купленное</button>':''}`}
const VL2=vList;vList=function(){return LK=='diary'?vDiary():LK=='debt'?vDebt():LK=='sub'?vSub():LK=='shop'?vShop():VL2()};
/* ---------- FULL BACKUP ---------- */
const MDB=()=>new Promise((ok,no)=>{const q=indexedDB.open('luna.media.v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('m');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const b2u=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
window.backupExport=async function(){try{toast('Готовлю полную копию…');const notes=await nreq('readonly',s=>s.getAll()),db=await MDB(),keys=await new Promise(ok=>{const r=db.transaction('m').objectStore('m').getAllKeys();r.onsuccess=()=>ok(r.result)}),media={};for(const k of keys){const b=await LM.mget(k);if(b)media[k]=await b2u(b)}
const blob=new Blob([JSON.stringify({app:'LUNA',version:4,created:new Date().toISOString(),data:S,notes,media})],{type:'application/json'});await lunaSaveFile(new File([blob],'LUNA-backup-'+today()+'.json',{type:'application/json'}));toast('Копия готова: данные, заметки, фото и видео')}catch(e){toast('Не удалось подготовить копию')}};
window.backupImport=function(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(o.app!=='LUNA'||!o.data?.acc||!o.data?.tx)throw 0;if(!confirm('Заменить текущие данные копией? Сначала сохраните текущую копию.'))return;S=o.data;save();
if(Array.isArray(o.notes)){const db=await NDB();await new Promise((ok,no)=>{const tx=db.transaction('notes','readwrite'),st=tx.objectStore('notes');st.clear();o.notes.forEach(n=>st.put(n));tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
for(const [k,u] of Object.entries(o.media||{})){await LM.mput(k,await (await fetch(u)).blob())}
S.items=S.items||[];render();toast('Всё восстановлено')}catch(e){toast('Файл копии не распознан или восстановление не удалось')}};r.readAsText(f)};
render();
})();
</script></body></html>
